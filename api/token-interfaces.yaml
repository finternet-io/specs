                    msgId: "f1a2b3c4-d5e6-7890-1234-567890abcdef"
                    developerToken: "fnt_..."
                    authorization: "Bearer eyJ..."
                  payload:
                    operation: "transfer"
                    tokenId: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                    to: "bob"
                    value: "100000000"
